data_dir: data/full
database: data/full/proofplane.sqlite3
artifacts_dir: data/full/artifacts
split_seed: 0
case_limit: 0
models:
  reasoning: gpt-5.4-nano-2026-03-17
  fast: gpt-4.1-mini
  embedding: text-embedding-3-small
generation_k: [1, 3, 5, 10]
retrieval_top_k: 3
candidate_pool_size: 10
mmr_lambda: 0.7
hybrid_weights: {descriptor: 0.4, code: 0.25, sequence: 0.2, metadata: 0.15}
metadata_field_weights: {component_roles: 1.0, operations_changed: 1.0, stateful_resources: 1.0}
max_context_chars: 30000
max_nearby_tests: 8
max_test_snippet_chars: 2500
max_repository_tree_entries: 100
generation_max_output_tokens: 10000
execution_timeout: 30
# Deliberately low guard. Raise only after choosing an explicit full-run spending ceiling.
api_budget_usd: 112.5
api_call_reserve_usd: 0.25
api_retry_attempts: 5
api_retry_base_seconds: 2.0
kite_api_budget_usd: 25.0
kite_temperature: 0.1
docker:
  network: none
  cpus: 1
  memory: 512m
  pids_limit: 128
cache: {enabled: true}
concurrency: 1
kite_max_target_units: 180
kite_max_focal_methods: 1
kite_max_unit_chars: 12000
kite_llm_target_profile: true
kite_retrieval_top_k: 10
kite_semantic_weight: 0.7
kite_structural_weight: 0.3
kite_max_injection_attempts: 10
kite_max_accepted_injections: 8
kite_injection_alignment_threshold: 0.42
kite_max_test_repairs: 4
kite_max_enhancement_rounds: 5
kite_embedding_batch_size: 96
kite_knowledge_group_similarity_threshold: 0.72
kite_knowledge_max_group_size: 8
kite_knowledge_review_min_confidence: 0.65
