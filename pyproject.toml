[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "proofplane-v0"
version = "0.1.0"
description = "Causal retrieval prototype for proactive regression-test generation"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0", "openai>=1.50", "pydantic>=2.8", "PyYAML>=6.0",
  "rich>=13.8", "typer>=0.12"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.12"]

[project.scripts]
proofplane = "proofplane_v0.cli:app"

[tool.setuptools.packages.find]
include = ["proofplane_v0*"]

[tool.setuptools.package-data]
proofplane_v0 = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["BugsInPy", "data"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
